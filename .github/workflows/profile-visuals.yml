name: Refresh profile visuals

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: profile-visuals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=%23137963
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2372E2C3

      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: '200'

      - name: Validate generated SVGs
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          paths = ['assets/github-snake.svg', 'assets/github-snake-dark.svg', 'profile-3d-contrib/profile-green-animate.svg', 'profile-3d-contrib/profile-night-rainbow.svg']
          for name in paths:
              path = Path(name)
              assert path.stat().st_size > 100, name
              assert ET.parse(path).getroot().tag == '{http://www.w3.org/2000/svg}svg', name
          PYTHON

      - name: Commit refreshed visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg profile-3d-contrib/profile-green-animate.svg profile-3d-contrib/profile-night-rainbow.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution animations'
          git pull --rebase
          git push
